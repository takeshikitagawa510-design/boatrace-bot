name: 3. Realtime Shinsum Monitor

on:
  workflow_dispatch:

# ★ 多重実行を完全に防止（前の処理が終わるまで重複起動させない）
concurrency:
  group: shinsum-monitor-group
  cancel-in-progress: false

# ★ リポジトリへコミット＆プッシュするための権限
permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests bs4

      - name: Run Shinsum Monitor
        env:
          SHINSUM_USER: ${{ secrets.SHINSUM_USER }}
          SHINSUM_PASS: ${{ secrets.SHINSUM_PASS }}
          MONITOR_DISCORD_WEBHOOK_URL: ${{ secrets.MONITOR_DISCORD_WEBHOOK_URL }}
          TETTAN_DISCORD_WEBHOOK_URL: ${{ secrets.TETTAN_DISCORD_WEBHOOK_URL }}
        run: python monitor.py

      - name: Run Result Checker
        env:
          RESULT_DISCORD_WEBHOOK_URL: ${{ secrets.RESULT_DISCORD_WEBHOOK_URL }}
        run: python result_checker.py

      - name: Save notification cache and pending results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add notified_races.json pending_results.json pending_pickup_races.json || true
          git commit -m "Auto-update cache and pending results [skip ci]" || exit 0
          git fetch origin main
          git rebase -X ours origin/main || git rebase --skip || true
          git push origin main
