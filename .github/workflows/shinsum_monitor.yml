name: 3. Realtime Shinsum Monitor

on:
  schedule:
    # JST 8:00 〜 22:55 (UTC 23:00 〜 13:55) の間、5分おきに自動起動
    - cron: '*/5 23-23 * * *'
    - cron: '*/5 0-13 * * *'
  workflow_dispatch:

# ★ リポジトリへコミット＆プッシュするための権限
permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests bs4

      - name: Run Shinsum Monitor
        env:
          SHINSUM_USER: ${{ secrets.SHINSUM_USER }}
          SHINSUM_PASS: ${{ secrets.SHINSUM_PASS }}
          MONITOR_DISCORD_WEBHOOK_URL: ${{ secrets.MONITOR_DISCORD_WEBHOOK_URL }}
        run: python monitor.py

      # 🔻 ここを追加しました（Playwrightのインストール）
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run Result Checker
        env:
          RESULT_DISCORD_WEBHOOK_URL: ${{ secrets.RESULT_DISCORD_WEBHOOK_URL }}
        run: python result_checker.py

      # ★ エラー対策＆追跡ファイルの自動コミット・保存
      - name: Save notification cache and pending results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add notified_races.json pending_results.json pending_pickup_races.json || true
          git commit -m "Auto-update cache and pending results [skip ci]" || exit 0
          git pull --rebase origin main || true
          git push origin main
