name: 2. Daily Boatrace Scanner Notification

on:
  workflow_dispatch: # 👈 外部APIからの起動のみ受け付ける

jobs:
  send-notify:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v3

      - name: Python環境構築
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: パッケージインストール
        run: |
          pip install requests bs4 curl_cffi

      - name: 朝の万舟スキャン ＆ Discord送信
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      # 👇 ここを修正（pull --rebase を挟んで競合を防ぐ）
      - name: 判定待ちデータの自動コミット＆プッシュ
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add pending_pickup_races.json
          git commit -m "Auto update: pending_pickup_races.json [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin main
