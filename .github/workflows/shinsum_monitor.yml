name: 3. Realtime Shinsum Monitor

on:
  workflow_dispatch:

# ★ 多重実行を完全に防止（前の処理が終わるまで重複起動させない）
concurrency:
  group: shinsum-monitor-group
  cancel-in-progress: false

# ★ リポジトリへコミット＆プッシュするための権限
permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests bs4

      - name: Run Shinsum Monitor
        env:
          SHINSUM_USER: ${{ secrets.SHINSUM_USER }}
          SHINSUM_PASS: ${{ secrets.SHINSUM_PASS }}
          MONITOR_DISCORD_WEBHOOK_URL: ${{ secrets.MONITOR_DISCORD_WEBHOOK_URL }}
          TETTAN_DISCORD_WEBHOOK_URL: ${{ secrets.TETTAN_DISCORD_WEBHOOK_URL }}
        run: python monitor.py

      - name: Run Result Checker
        env:
          RESULT_DISCORD_WEBHOOK_URL: ${{ secrets.RESULT_DISCORD_WEBHOOK_URL }}
          ALL_RESULT_DISCORD_WEBHOOK_URL: ${{ secrets.ALL_RESULT_DISCORD_WEBHOOK_URL }}
        run: python result_checker.py

      - name: Save notification cache and pending results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add notified_races.json pending_results.json pending_pickup_races.json || true
          if git diff --staged --quiet; then
            echo "変更がないためコミットをスキップします"
            exit 0
          fi
          git commit -m "Auto-update cache and pending results [skip ci]" || exit 0

          # GitHub側の一時障害（500エラー等）に備えて最大3回リトライ
          for i in {1..3}; do
            git fetch origin main
            git rebase -X ours origin/main || git rebase --skip || true
            if git push origin main; then
              echo "Push succeeded"
              exit 0
            fi
            echo "Push failed, retrying in 5 seconds... (attempt $i)"
            sleep 5
          done
          echo "Warning: Push failed after 3 attempts due to GitHub remote error, continuing workflow."
          exit 0
