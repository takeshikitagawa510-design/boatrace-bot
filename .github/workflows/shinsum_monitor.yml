name: 3. Realtime Shinsum Monitor

on:
  schedule:
    # JST 8:00 〜 22:55 (UTC 23:00 〜 13:55) の間、5分おきに自動起動
    - cron: '*/5 23-23 * * *'
    - cron: '*/5 0-13 * * *'
  workflow_dispatch:

# ★ 追加：リポジトリへコミット＆プッシュするための権限
permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests bs4

      - name: Run Shinsum Monitor
        env:
          MONITOR_DISCORD_WEBHOOK_URL: ${{ secrets.MONITOR_DISCORD_WEBHOOK_URL }}
        run: python monitor.py

      # ★ 追加：通知済みレースキャッシュ（notified_races.json）を自動コミット＆保存
      - name: Save notification cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add notified_races.json
          git commit -m "Auto-update notified races cache [skip ci]" || exit 0
          git push
