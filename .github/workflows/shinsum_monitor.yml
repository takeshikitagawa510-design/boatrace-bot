name: 3. Realtime Shinsum Monitor

on:
  schedule:
    # JST 8:00 〜 22:55 (UTC 23:00 〜 13:55) の間、5分おきに自動起動
    - cron: '*/5 23-23 * * *'
    - cron: '*/5 0-13 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests bs4

      - name: Run Shinsum Monitor
        env:
          MONITOR_DISCORD_WEBHOOK_URL: ${{ secrets.MONITOR_DISCORD_WEBHOOK_URL }}
        run: python monitor.py
